[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aih-bitrix"
version = "0.1.0"
description = "Hermes: laudos AIH (SUS) em PDF -> Contato + card da SPA 'Leads Auxilio Acidente' no Bitrix24"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pdfplumber>=0.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aih-bitrix = "aih_bitrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
